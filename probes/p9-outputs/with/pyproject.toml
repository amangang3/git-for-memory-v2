[project]
name = "csv2json"
version = "0.1.0"
description = "Small command-line tool that converts a CSV file to JSON."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csv2json = "csv2json.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
